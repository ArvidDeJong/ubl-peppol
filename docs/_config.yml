title: UBL PEPPOL
description: PHP library that builds UBL 2.1 e-invoices and credit notes for PEPPOL BIS Billing 3.0 and EN 16931, with a Dutch and a Belgian builder. Plain PHP; the Laravel layer that sends to an access point provider is optional.
url: https://arviddejong.github.io
baseurl: /ubl-peppol

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/ubl-peppol
  repository: https://github.com/ArvidDeJong/ubl-peppol
  packagist: https://packagist.org/packages/darvis/ubl-peppol
  license_url: https://github.com/ArvidDeJong/ubl-peppol/blob/main/LICENSE
  requires: "PHP 8.2+ with the dom and libxml extensions; bcmath for IBAN checks and soap for the VIES check. Laravel 11, 12 or 13 only for the optional Laravel layer."
  platforms: [PHP, Laravel]
  keywords: [ubl, peppol, e-invoicing, e-invoice php, en 16931, peppol bis billing 3.0, ubl invoice xml, credit note, vies vat check, kvk, kbo, access point, laravel]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/ubl-peppol
  Packagist: https://packagist.org/packages/darvis/ubl-peppol
  "In Dutch": https://peppol-koppeling.nl/
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/ubl-peppol
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Social preview image for every page (Open Graph and Twitter card, through jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
